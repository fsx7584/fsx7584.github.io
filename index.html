<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSX7584 | الموقع الشخصي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: #121215;
            --primary-color: #ffffff;
            --secondary-color: #a1a1aa;
            --text-color: #f4f4f5;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #000000;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #0f172a;
            --secondary-color: #64748b;
            --text-color: #0f172a;
            --accent-glow: rgba(15, 23, 42, 0.08);
            --border-color: rgba(15, 23, 42, 0.12);
            --input-bg: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .control-btn:hover {
            border-color: var(--primary-color);
        }

        .page-container {
            margin-top: 80px;
            padding: 40px 8%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            max-width: 800px;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .speech-bubble {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            box-shadow: 0 0 20px var(--accent-glow);
            position: relative;
        }

        .avatar-box {
            cursor: pointer;
        }

        .avatar-video {
            width: 220px;
            max-width: 80vw;
            height: auto;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            filter: drop-shadow(0 0 25px var(--accent-glow));
            object-fit: cover;
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        p {
            font-size: 1.1rem;
            color: var(--secondary-color);
            margin-bottom: 25px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 10px 28px;
            background: var(--primary-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            display: inline-block;
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin-top: 10px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: transform 0.2s, border-color 0.2s;
        }

        .social-link:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
        }

        .contact-form {
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: right;
        }

        [dir="ltr"] .contact-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--secondary-color);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: var(--card-bg);
            color: var(--secondary-color);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FSX7584</div>
        <div class="controls">
            <button class="control-btn" onclick="toggleLanguage()" id="langBtn">English</button>
            <button class="control-btn" onclick="toggleTheme()" id="themeBtn">☀️ فاتح</button>
        </div>
    </header>

    <div class="page-container">

        <!-- الصفحة الأولى: الترحيب بالفيديو -->
        <div class="page active" id="page1">
            <div class="avatar-container">
                <div class="speech-bubble" id="speechBubble">مرحباً بك في موقع FSX7584! 👋</div>
                <div class="avatar-box" onclick="greetUser()">
                    <video class="avatar-video" autoplay loop muted playsinline preload="auto">
                        <source src="./video-output-AC78C5D7-E112-4DE8-B05A-231474A771C5-2.mp4" type="video/mp4">
                    </video>
                </div>
            </div>
            <h1 data-ar="مرحباً بكم في FSX7584" data-en="Welcome to FSX7584">مرحباً بكم في FSX7584</h1>
            <p data-ar="موقعي الشخصي لاستعراض المشاريع والتصاميم والخبرات." data-en="My personal website to showcase projects, designs, and expertise.">موقعي الشخصي لاستعراض المشاريع والتصاميم والخبرات.</p>

            <div class="nav-buttons">
                <button class="btn" onclick="changePage(2)" data-ar="التالي ⬅️" data-en="Next ➡️">التالي ⬅️</button>
            </div>
        </div>

        <!-- الصفحة الثانية: حساباتي (TikTok & Discord) -->
        <div class="page" id="page2">
            <h2 class="section-title" data-ar="حساباتي" data-en="My Socials">حساباتي</h2>
            <p data-ar="يمكنك متابعتي والتواصل معي عبر المنصات التالية:" data-en="Follow and connect with me on these platforms:">يمكنك متابعتي والتواصل معي عبر المنصات التالية:</p>

            <div class="social-grid">
                <!-- رابط التيك توك -->
                <a href="https://www.tiktok.com/@fsx7584?_r=1&_t=ZS-9APsgWAyUQ3" target="_blank" class="social-link">
                    <span>TikTok</span>
                    <span>🎵</span>
                </a>
                <!-- رابط ديسكورد مع النص المطلوب Send Friend Request -->
                <a href="https://discord.gg/xCPSbKJd" target="_blank" rel="noopener noreferrer" class="social-link">
                    <span>Send Friend Request</span>
                    <span>💬</span>
                </a>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-outline" onclick="changePage(1)" data-ar="➡️ السابق" data-en="⬅️ Previous">➡️ السابق</button>
                <button class="btn" onclick="changePage(3)" data-ar="التالي ⬅️" data-en="Next ➡️">التالي ⬅️</button>
            </div>
        </div>

        <!-- الصفحة الثالثة: التواصل المباشر -->
        <div class="page" id="page3">
            <h2 class="section-title" data-ar="تواصل معي" data-en="Contact Me">تواصل معي</h2>
            <form class="contact-form" onsubmit="event.preventDefault(); alert(currentLang==='ar'?'شكراً لتواصلك!':'Thank you!');">
                <div class="form-group">
                    <label data-ar="الاسم" data-en="Name">الاسم</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label data-ar="الرسالة" data-en="Message">الرسالة</label>
                    <textarea rows="4" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;" data-ar="إرسال" data-en="Send">إرسال</button>
            </form>

            <div class="nav-buttons">
                <button class="btn btn-outline" onclick="changePage(2)" data-ar="➡️ السابق" data-en="⬅️ Previous">➡️ السابق</button>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 FSX7584. <span data-ar="جميع الحقوق محفوظة." data-en="All rights reserved.">جميع الحقوق محفوظة.</span></p>
    </footer>

    <script>
        let currentPage = 1;
        let currentLang = 'ar';
        let currentTheme = 'dark';

        const arMessages = ["أهلاً بك زائرنا العزيز! ✨", "تسعدنا زيارتك لموقع FSX7584! 🚀", "استمتع بتصفح الموقع! 🎨"];
        const enMessages = ["Welcome dear visitor! ✨", "Glad to have you at FSX7584! 🚀", "Enjoy exploring the website! 🎨"];
        let msgIndex = 0;

        function changePage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page${pageNum}`).classList.add('active');
            currentPage = pageNum;
            window.scrollTo(0,0);
        }

        function greetUser() {
            const msgs = currentLang === 'ar' ? arMessages : enMessages;
            msgIndex = (msgIndex + 1) % msgs.length;
            document.getElementById('speechBubble').innerText = msgs[msgIndex];
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? (currentLang === 'ar' ? '☀️ فاتح' : '☀️ Light') : (currentLang === 'ar' ? '🌙 داكن' : '🌙 Dark');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', currentLang);

            document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
            document.getElementById('themeBtn').innerText = currentTheme === 'dark' ? (currentLang === 'ar' ? '☀️ فاتح' : '☀️ Light') : (currentLang === 'ar' ? '🌙 داكن' : '🌙 Dark');

            document.querySelectorAll('[data-ar]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });

            document.getElementById('speechBubble').innerText = currentLang === 'ar' ? "مرحباً بك في موقع FSX7584! 👋" : "Welcome to FSX7584! 👋";
        }
    </script>
</body>
</html>
